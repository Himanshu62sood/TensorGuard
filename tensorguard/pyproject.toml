[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorguard"
version = "0.1.0"
description = "AI Model Supply Chain & Serialization Security Scanner"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Himanshu Sood" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "click>=8.0.0",
    "rich>=12.0.0",
    "numpy>=1.20.0",
    "safetensors>=0.3.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
tensorguard = "tensorguard.cli:main"

[tool.setuptools.packages.find]
include = ["tensorguard*"]