@'
name: TensorGuard AI Supply Chain Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Run Test Suite
        run: python -m pytest -v

      - name: TensorGuard Repository Self-Audit
        run: |
          python -m tensorguard.cli scan . --fail-on HIGH || true
          python -m tensorguard.cli history
          python -m tensorguard.cli report -o tensorguard_ci_report.html

      - name: Archive Compliance Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tensorguard-audit-report
          path: tensorguard_ci_report.html
'@ | Out-File -FilePath ".github\workflows\security-scan.yml" -Encoding utf8