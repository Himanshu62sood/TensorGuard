[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorguard"
version = "0.1.0"
description = "AI Model Supply Chain & Serialization Security Scanner"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "safetensors>=0.4.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
]

[project.scripts]
tensorguard = "tensorguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tensorguard*"]